# 푸시·PR마다 타입 검사 → 린트 → 자동 테스트 → 빌드를 돌린다.
# (실서버 배포는 Cloudflare가 따로 한다. 여기서 실패하면 GitHub에 빨간 X로 보인다)
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 타입 검사
        run: npx next typegen && npx tsc --noEmit
      - name: 린트
        run: npm run lint
      - name: 자동 테스트
        run: npm test
      - name: 빌드
        run: npm run build
